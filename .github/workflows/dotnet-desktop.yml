name: .NET Desktop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Configuration: ${{ matrix.configuration }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 🔧 Restore solution
    - name: Restore
      run: msbuild /t:Restore

    # 🔧 Build solution
    - name: Build
      run: msbuild /p:Configuration=$env:Configuration

    # 🧪 Run tests (only if you have test project)
    - name: Test
      run: dotnet test || echo "No test project or tests skipped"

    # 📦 Upload artifacts (optional)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-output-${{ matrix.configuration }}
        path: |
          **/bin/${{ matrix.configuration }}/
