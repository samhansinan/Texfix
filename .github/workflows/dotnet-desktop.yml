name: .NET Web API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ✅ Install NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # ✅ Restore packages (IMPORTANT)
    - name: Restore NuGet packages
      run: nuget restore ItemWebapi.sln

    # ✅ Setup MSBuild (IMPORTANT for WebApp)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ✅ Build solution (NOT dotnet build/test)
    - name: Build solution
      run: msbuild ItemWebapi.sln /p:Configuration=Debug

    # ❌ DO NOT use dotnet test for this project
    # Replace with placeholder
    - name: Test step (skipped)
      run: echo "No compatible test runner for this WebApplication project"
