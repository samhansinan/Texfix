name: .NET Web API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ✅ Install NuGet
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # ✅ Restore NuGet packages (THIS FIXES YOUR ERROR)
    - name: Restore NuGet packages
      run: nuget restore ItemWebapi.sln

    # OR alternative (if above fails):
    # - run: msbuild /t:Restore ItemWebapi.sln

    # ✅ Setup MSBuild
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ✅ Build project
    - name: Build
      run: msbuild ItemWebapi.sln /p:Configuration=Debug

    # Optional tests
    - name: Test
      run: dotnet test || echo "No tests found"
